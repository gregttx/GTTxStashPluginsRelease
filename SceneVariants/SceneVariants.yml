name: ᝯㄝₓ Scene Variants
description: "A scene is often in your library twice: the whole thing, and a cut out of it. Stash has no way to say the two are the same work, so this plugin works it out and gives the scene page a tab that shows you.\n\nOpen any scene and there is a Variants tab beside Details, File Info and Edit. It lists every other scene sharing this one's stash-id, with the cover image and the preview loop it plays on hover, its resolution and running time, longest first - and where there is nothing to list it says why. The tab itself writes nothing: it is two read queries and a list of links. Hover a row and it tells you how that variant differs from the scene you are on: the tags it has that this one does not, the tags it is missing, and the names of the attributes that disagree - which fields differ, not what either of them says.\n\nName your full-length and partial-length tags below and each row says which it is, with the full-length ones sorted to the top - that is the question the tab exists to answer, and the tags are the cheap half of it. A name matches any of the tag's aliases too, and a scene tagged with anything under that tag in your hierarchy counts as tagged with it, so naming the general tag covers every specific one beneath it. Rows read Full-length and Partial-length rather than echoing your tag names back; the tag that decided a row is on its hover text. Leave both names empty and the tab still lists the variants, just without saying which is which.\n\nA stash-id, or the variant stash-id custom field this plugin's migration task writes, is the evidence used - a partial-length cut should not carry a real stash-id, because that id names the whole work, so the task moves it into a field of its own and the tab matches on both. A second task, Flag Variants, keeps a flag tag on every scene that has at least one other variant, so one tag filter lists every scene offering a choice - and putting that tag on scenes yourself makes them candidates the task offers to group into a variant set of their own, with a pseudo stash-id, even where no real one exists. A Synchronize Variants button on the tab pushes this scene's attribute values to its variants - every difference listed with a checkbox first, old value to new - the cover image too, if you turn that comparison on - tags, performers and groups only ever added so a variant's own extras survive - and a tag another tag on the same scene already implies is left out, which ᝯㄝₓ Normalize Parent Tags decides rather than this plugin - and a tag another tag on the same scene already implies is left out, which ᝯㄝₓ Normalize Parent Tags decides rather than this plugin - a group joined at this scene's own position in it, adds preselected while replaces stay unticked until you say so, and nothing written until you approve, with Undo while the dialog stays open. Saving a scene in its edit form offers the same dialog by itself, scoped to exactly the attributes that save changed, removals included, so a replaced URL or a dropped tag follows too - everything preselected except titles, since each line is the edit you just made - on by default and switchable off in the settings, with title changes only offered when a second setting opts them in. A third task, Review Variant Sets, works the other way round: it lists every multi-variant set in your library scored by how far its members have drifted apart - an attribute they disagree on is worth five by default, a tag, performer or group one carries and another does not is worth one, and all four numbers are editable in the dialog with a Remember option - worst first, so you can pick a set, pick the scene whose values are right, and push them to the rest one set at a time. A scene that never got one, or whose variants never got one, gets a tab that says so; matching on titles and on shared performers is not built yet, so about two scenes in three have nothing to list today. A scene carrying both tags at once is shown in red, because the two are meant to be exclusive.\n\nRequires Stash 0.28.0 or newer: the tab is added through the scene page's own plugin extension points, so there is no version of it that works without them."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/SceneVariants/README.md"
version: 1.4.1
ui:
  # Loaded before this script, and installed with it. `plugins.tsx` topologically
  # sorts on this and `useScript` sets `async = false`, so ᝯㄝₓ Core has finished
  # running before this file begins - which is what lets the shared blocks be bound
  # at load rather than looked up on every call.
  requires:
    - GTTxCore
  javascript:
    - SceneVariants.js
settings:
  a1FullLengthTag:
    displayName: Full-length Tag
    description: "The tag you put on a scene that is the whole work.\n\nTyped rather than picked, and compared without regard to case or surrounding spaces. Any of the tag's aliases finds it as well as its name, and a scene wearing any descendant of it counts as wearing it. Leave it empty and the tab still lists the variants - it simply says nothing about which of them is the full one, which is the honest answer when nothing has been tagged. A link to the tag appears beside the value once the name resolves; no link means it matches nothing, and every scene will list as unclassified.\n\nThis is the discriminator for the one dimension the plugin knows about. It reads the tag and never writes it: a scene missing the tag is listed unclassified rather than corrected."
    type: STRING
  a2PartialLengthTag:
    displayName: Partial-length Tag
    description: "The tag you put on a scene that is a cut out of a longer one.\n\nSame rules as the full-length tag above: typed, case-insensitive, aliases and descendants included, optional, and linked beside the value once it resolves. Scenes wearing it sort below the full-length ones, since the tab's usual question is which variant is the whole work.\n\nA scene carrying this tag and the full-length one at the same time is shown in red. The two values are mutually exclusive by definition, so the plugin reports the contradiction rather than picking a winner. If the two settings name the same tag, or two tags one of which is inside the other, the tab warns above the list instead: every scene under the overlap would otherwise be reported as a contradiction of its own."
    type: STRING
  a3VariantStashIdField:
    displayName: Variant Stash-ID Custom Field
    description: "The custom field the migration task writes a variant's stash-id into.\n\nThe default, ᱜ╦╦🞮_Variant_Stash_ID, is written into this box the first time the plugin loads, so what you see here is the name it is actually using - Stash has no default for a plugin setting, and an empty box would leave you nothing to search for in Stash's own custom fields panel. Clearing it goes back to that same default rather than switching anything off, and a box you have cleared is left cleared. The value is one line per stash-id, written as <provider>:<stash-id> - stashdb.org:9f3c1e2a-… - so it stays readable in Stash's own custom fields panel.\n\nChange it only if that name collides with a field you already use. Renaming it here does not move anything already written: the tab will stop finding scenes migrated under the old name, and the task will write the new one beside it."
    type: STRING
  a4VariantFlagTag:
    displayName: Variant Flag Tag
    description: "The tag the Flag Variants task keeps on every scene that has at least one other variant in your library - filter or click that tag and you have every scene offering a choice of variants.\n\nThe default, ᱜ╦╦🞮⸎✱MultiVariants❌∙, is written into this box the first time the plugin loads, the same way the custom field's name is; clearing it goes back to that same default. The tag is created by the task's Proceed if it does not exist yet - as an orphan, ignored by auto-tagging, with the alias GTTx Multiple Variants, a description saying what it means, the never-propagate mark set for the merge plugins, and the hide-from-add-lists mark present but off. The name is matched without regard to case, and any of the tag's aliases finds it; a link appears beside the value once it resolves.\n\nThe tag is machine-kept and not a source of truth: it says what the last run of the task found, nothing fresher. The task both adds it and removes it, so a scene whose variants have since been merged away loses the flag on the next run."
    type: STRING
  b1LogToConsole:
    displayName: Log to the Browser Console
    description: "Print each variant lookup to the browser console.\n\nOff by default. It names the scene, how many variants were found and what they were matched on, under the [svr] prefix.\n\nThis is not the tab diagnostic: for that, type __GTTx__.StashPluginCoop.debugButtons = true into the console, which turns on an [svr gate] channel in every plugin that draws a control into Stash's chrome and says why each one is shown or hidden. A failed variant query is always reported, with or without either switch."
    type: BOOLEAN
  c1PropagateOnSave:
    displayName: Offer to Propagate Edits to Variants
    description: "When you save a scene that has variants, open a dialog offering to push the changed attributes to them.\n\nOn by default - the switch is set the first time the plugin loads, so what you see here is the state it is actually in. The dialog lists one checkbox line per changed attribute per variant, old value to new - adds for what the save added, and removals for the tags, performers or URLs it took off, on variants still carrying them, so a replaced URL can be replaced on the variants too; a variant's own extras are never touched, and nothing is written until you approve, and Undo puts it back while the dialog stays open. It only appears when the save changed something the variants do not have - an unremarkable save shows nothing.\n\nTitle changes are only offered when the setting below is also on. The dialog stays away entirely while another plugin is running a bulk edit in this tab, so a library-wide rewrite cannot raise one dialog per scene."
    type: BOOLEAN
  c2PropagateTitleOnSave:
    displayName: Offer Title Changes Too
    description: "Also list the title in the propagate dialog when a save changed it.\n\nOff by default: a title is the one value a variant most deliberately owns - a '- Clip' postfix, a part number - so pushing it is opted into twice, here and then per line in the dialog, where title lines start unticked like every other replace. While this is off, a dialog raised by a save that changed the title says so in its listing rather than silently dropping the change.\n\nOnly the save-triggered dialog reads this: the Synchronize Variants button on the tab always lists titles, unticked."
    type: BOOLEAN
  c3SkipRedundantTags:
    displayName: Skip Tags the Hierarchy Makes Redundant
    description: "Do not push a tag that another tag on the same scene already implies.\n\nOn by default - the switch is set the first time the plugin loads. A scene tagged both Blonde and its parent Hair Colour carries one tag that says nothing the other does not; copying that onto every variant spreads the redundancy, so it is left out of the listing and a line says how many were dropped.\n\nWhat counts as redundant is not decided here: ᝯㄝₓ Normalize Parent Tags is asked, so its own hierarchy and its own tag exclusions are what answer - a tag you have told that plugin to leave alone is never dropped here either. With that plugin absent, disabled, or older than 3.2.0, nothing can answer and every dialog says so in its listing rather than filtering silently. It affects only what is offered: nothing is ever pruned from a scene by this plugin."
    type: BOOLEAN
  c4CheckCoverMismatch:
    displayName: Compare Cover Images
    description: "Also compare the variants' cover images, and offer to push this scene's where they differ.\n\nOff by default, because it is the one comparison here that costs a picture downloaded per scene rather than a field already read. Turn it on if your covers come from a stash-box and a rescan occasionally replaces one with a frame from the file: pick the variant that still has the right cover as the source, and every variant that differs is offered it.\n\nCompared by the image itself, not by its address - every scene has a cover URL of its own whatever the pictures are - so variants already sharing a cover list nothing. A variant whose own cover cannot be read is not offered one, since Undo would then have nothing to put back. With this on, setting a cover on a scene that has variants also raises the propagate dialog for it; a rescan does not, because nothing about it reaches your browser. Undo restores the picture, which for a cover Stash generated means those same pixels come back as a stored cover."
    type: BOOLEAN

tasks:
  - name: Migrate Variant Stash-IDs...
    description: Move the stash-id of every partial-length scene into a custom field and take the stash-id off it - a stash-id names the whole work, and a cut out of it is not that work. Full-length scenes get the same field and keep their stash-ids, which is what lets the Variants tab find a whole variant set in one query. Every scene it would write is listed before anything is written, and Undo puts them all back while the dialog stays open.
  - name: Review Variant Sets...
    description: List every multi-variant set in your library, worst first - scored by how far its members have drifted apart, counting the attributes they disagree on and the tags, performers and groups one carries and another does not. What each kind of difference is worth is set in the dialog itself, from 0 to 100, and Remember keeps your numbers for next time. Open a set, pick the scene whose values are right, and Synchronize Set lists exactly what would be pushed to the others - the same checkbox listing the Variants tab's own button produces - with nothing written until you press Proceed, and Undo while the dialog stays open.
  - name: Flag Variants...
    description: Put the variant flag tag on every scene that shares a stash-id - real or migrated - with at least one other scene, and take it off every scene it marks that no longer does. Filtering by that tag then lists every scene offering a choice of variants. A scene carrying the flag with no stash-id and no variant field at all is listed with a checkbox instead of being unflagged - tag scenes yourself and run this task to declare them a set - and Create Variant Group writes one shared pseudo stash-id into the ticked ones, or Remove Tag takes the leftover flag off. The tag is not a source of truth - it says what the last run found - and every scene the task would touch is listed before anything is written, with Undo while the dialog stays open.
