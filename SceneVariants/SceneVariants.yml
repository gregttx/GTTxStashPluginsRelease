name: ᝯㄝₓ Scene Variants
description: "A scene is often in your library twice: the full version and a cut from it. This plugin links them by stash-id and shows them on the scene page.\n\nA scene with other variants gets a Variants tab listing them with cover, preview, resolution and running time. Hover a row to see how that variant differs: the tags it adds or lacks, and which fields disagree. Name your full-duration and partial-duration tags in Tags and Fields, below, and every row is labeled, full-duration first; tags beneath them in your hierarchy count too.\n\nSynchronize Variants pushes this scene's values to its variants. Every difference is listed first, nothing is written until you approve, and Undo works while the dialog stays open. Saving a scene offers the same for what you just changed, unless you switch that off in Scene Page Behavior, below.\n\nThree tasks keep the sets in order. Migrate Variant Stash-IDs moves the stash-id off partial-duration cuts into a custom field, since a stash-id names the whole work. Flag Variants tags every scene that has variants, so one filter lists them all, and tagging scenes yourself groups them into a new set. Review Variant Sets lists sets by how far their members have drifted apart, worst first.\n\nScene cards show ⸎ and the variant count, and a partial-duration scene gets an Open Full-Duration button. A scene with neither a stash-id nor the variant field has nothing to match against.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/SceneVariants/README.md"
version: 3.2.0
ui:
  # Loaded before this script, and installed with it. `plugins.tsx` topologically
  # sorts on this and `useScript` sets `async = false`, so ᝯㄝₓ Core has finished
  # running before this file begins - which is what lets the shared blocks be bound
  # at load rather than looked up on every call.
  requires:
    - GTTxCore
  javascript:
    - SceneVariants.js
tasks:
  - name: Migrate Variant Stash-IDs...
    description: Move the stash-id of every partial-duration scene into a custom field and take the stash-id off it - a stash-id names the whole work, and a cut out of it is not that work. Full-duration scenes get the same field and keep their stash-ids, which is what lets the Variants tab find a whole variant set in one query. Every scene it would write is listed before anything is written, and Undo puts them all back while the dialog stays open.
  - name: Flag Variants...
    description: Put the variant flag tag on every scene that shares a stash-id - real or migrated - with at least one other scene, and take it off every scene it marks that no longer does. Filtering by that tag then lists every scene offering a choice of variants. A scene carrying the flag with no stash-id and no variant field at all is listed with a checkbox instead of being unflagged - tag scenes yourself and run this task to declare them a set - and Create Variant Group writes one shared pseudo-stash-id into the ticked ones, or Remove Tag takes the leftover flag off. The tag is not a source of truth - it says what the last run found - and every scene the task would touch is listed before anything is written, with Undo while the dialog stays open.
  - name: Review Variant Sets...
    description: List every multi-variant set in your library, worst first - each with a drift-score saying how far its members have drifted apart, counting the attributes they disagree on and the tags, performers and groups one carries and another does not. What each kind of difference is worth is set in the dialog itself, from 0 to 100, and Remember keeps your numbers for next time. Open a set, pick the scene whose values are right, and Synchronize Set from Selected lists exactly what would be pushed to the others - the same checkbox listing the Variants tab's own button produces - with nothing written until you press Proceed, and Undo while the dialog stays open. Tick Exclude Organized in the same strip to leave scenes marked Organized out of the listing, and a scene carrying the base-title custom field never counts toward a set's title drift.
  - name: Rename Variants...
    description: Name every partial-duration scene in a variant set after its set - the base-title the set's titles share, the postfix from the settings, and an index where the set has more than one partial, counted longest first and kept where a title already carries one. Full-duration scenes are never renamed. Every proposed title is listed with a checkbox, none ticked, nothing is written until you press Proceed, and Undo puts the titles back while the dialog stays open.
