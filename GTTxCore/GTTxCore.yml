name: ᝯㄝₓ Core
description: "Shared code for the ᝯㄝₓ plugins, plus a few features that belong to none of them. Every other ᝯㄝₓ plugin depends on it, so Stash installs it with them.\n\nIts settings are three buttons. General Globals... holds the options that reach every plugin or Stash's own pages: a louder Scene Tagger duration warning, right-click Paste in the Tags, Performers and Groups boxes, links opening in the same tab, counts on headings such as Tags (12), case-sensitive matching, the ⓕ and 🖬 card counters, and how many log lines a dialog keeps. Undo History Settings... sets how much history is kept. Dev Mods... holds switches for working on the plugins; none of them writes anything.\n\nUndo History keeps what the ᝯㄝₓ plugins write, and what you save on Stash's own pages, in this browser, so it can be undone later from Settings - Tasks or the ↶ button in the top bar. A change is undone only while its field still holds what was written, so a later edit is never overwritten. Back Up and Export saves the history with a database backup. Edits from another browser, Stash's own tasks or scripts are not recorded, and a deleted entity comes back under a new id.\n\nNothing else here writes to your library.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/GTTxCore/README.md"
version: 4.3.1
ui:
  javascript:
    - glossary.gen.js
    - GTTxCore.js
settings:
  b1DevMods:
    displayName: Dev Mods
    description: "Three switches for working on these plugins, not for using them.\n\nPress Dev Mods... to open them. Debug mode turns on the [<prefix> gate] console channel in every ᝯㄝₓ plugin that draws a control into Stash's own rows, saying for each one whether it is shown or hidden and why. Layout edit mode outlines every control these plugins have injected into Stash's chrome and labels it with the plugin that owns it. Stale UI demo makes the red Reload UI button appear beside Stash's own Reload plugins without waiting for a real version mismatch.\n\nAll three are off by default and none of them changes anything in your library. They are stored here so the console incantation is not the only way in; the console still works, and still uses the same flags."
    type: STRING
tasks:
  - name: Undo History...
    description: Open Undo History - what the ᝯㄝₓ plugins wrote and what you saved in Stash's own pages in this browser, newest first - to undo any of it. Ticked changes are checked against what your library holds now and listed before anything is written, and a change is undone only while its field still holds what was written, so a later edit is never overwritten. The same history opens from the ↶ button in Stash's top bar.
