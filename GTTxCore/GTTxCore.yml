name: ᝯㄝₓ Core
description: "Shared code for the ᝯㄝₓ plugins, plus a few features that belong to none of them. Every other ᝯㄝₓ plugin depends on it, so Stash installs it with them.\n\nIts settings are three buttons, a number and a switch. UI Customizations... holds the options that reach every plugin or Stash's own pages: a louder Scene Tagger duration warning, right-click Paste in the Tags, Performers and Groups boxes, links opening in the same tab, counts on headings such as Tags (12), folding every plugin's settings, the ⓕ and 🖬 card counters, how many lines a dialog draws at once, whether the dialogs follow the Stash theme, and the text and background colors the plugins draw in; Set All to Default at the bottom of that dialog puts all of them back. Undo History Settings... sets how much history is kept. Maximum Log Lines Kept sets how many log lines a dialog keeps for Copy log. Case-Sensitive Matching sets where the Case-sensitive box starts in every text search. Dev Mods... holds switches for working on the plugins, and each plugin's console logging; none of them writes anything.\n\nUndo History keeps what the ᝯㄝₓ plugins write, and what you save on Stash's own pages, in this browser, so it can be undone later from Settings - Tasks or the ↶ button in the top bar. A change is undone only while its field still holds what was written, so a later edit is never overwritten. Back Up and Export saves the history with a database backup. Edits from another browser, Stash's own tasks or scripts are not recorded, and a deleted entity comes back under a new id.\n\nNothing else here writes to your library.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/GTTxCore/README.md"
version: 5.1.1
ui:
  javascript:
    - glossary.gen.js
    - GTTxCore.js
settings:
  a5LogLinesKept:
    displayName: Maximum Log Lines Kept (1000 to 5000000)
    description: "How many log lines a ᝯㄝₓ dialog keeps for Copy log: 1000 to 5000000, clamped. Default 200000.\n\nEvery dialog draws only its last lines - as many as Lines Drawn at Once says, in UI Customizations - but keeps the rest so Copy log can hand over the whole run. Past this number the oldest are dropped and the copy says how many went. About 200 bytes a line: 200000 lines is roughly 40 MB."
    type: NUMBER
  a6CaseSensitive:
    displayName: Case-Sensitive Matching
    description: "Where the Case-sensitive box starts in every ᝯㄝₓ dialog that searches text.\n\nOff by default: \"beach\" finds \"Beach\" and \"BEACH\" too. On: the box starts ticked and only the text written exactly so is found. Ticking or unticking the box in a dialog lasts for that dialog and leaves this setting as it is."
    type: BOOLEAN
  b1DevMods:
    displayName: Dev Mods
    description: "Switches for working on these plugins, not for using them, and each plugin's console logging.\n\nPress Dev Mods... to open them. Log Button Visibility to the Browser Console prints, for every control a ᝯㄝₓ plugin draws into Stash's pages, whether it is shown or hidden and why. The next five log what Propagate Tags and Performers, Scene Variants, Merge Performer Tags, Entity Name Maintainer and Tag Bundle Clipboard do, each under its own prefix. Layout edit mode outlines every control these plugins have injected into Stash's chrome and labels it with the plugin that owns it. Stale UI demo makes the red Reload UI button appear beside Stash's own Reload plugins without waiting for a real version mismatch.\n\nAll are off by default, and none of them writes anything. The last two are not meant to be left on."
    type: STRING
tasks:
  - name: Undo History...
    description: Open Undo History - what the ᝯㄝₓ plugins wrote and what you saved in Stash's own pages in this browser, newest first - to undo any of it. Ticked changes are checked against what your library holds now and listed before anything is written, and a change is undone only while its field still holds what was written, so a later edit is never overwritten. The same history opens from the ↶ button in Stash's top bar.
