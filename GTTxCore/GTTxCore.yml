name: ᝯㄝₓ Core
description: "The shared half of the ᝯㄝₓ plugins, and the home for the things that belong to none of them.\n\nInstall this alongside any other ᝯㄝₓ plugin. They each declare it as a dependency, so Stash installs it with them and loads it first; on its own it changes nothing about your library and adds no task. What it holds is the code they all used to carry a copy of: the hover card that opens on an entity's name, the tooltip on a tag, the mark beside a setting that names a custom field, the red Reload UI button, and the rules that decide where a plugin's button lands in one of Stash's own rows and in what order when two plugins want the same row.\n\nScene Tagger duration warning: Stash's tagger prints \"Duration off by at least Ns\" in the same weight and colour as everything beside it, and it is the one line on that card that says whether a match is the right file. Turn this on and it is emphasised - larger, capitalised and red past five seconds, amber above one - and left exactly as Stash wrote it below that. It is off by default, because it changes a page this plugin does not own, and it changes nothing but the styling: no result is hidden, reordered or acted on.\n\nRight-click Paste: the Tags, Performers and Groups boxes offer no Paste in the browser's context menu, because the text input inside them is sized to what has been typed and a right-click with nothing typed lands beside it rather than on it. Turn this on and the input fills the rest of the row, so the browser offers its own Paste; the paste takes the same path Ctrl+V already does. Off by default.\n\nDev Mods: three switches for working on these plugins rather than for using them. Debug mode turns on the console channel that says why each injected control is shown or hidden; Layout edit mode outlines every control these plugins have added to Stash's chrome and labels it with the plugin that put it there; Stale UI demo makes the red Reload UI button appear without waiting for a real version mismatch. All three are off by default, none of them writes anything, and none is meant to be left on.\n\nNothing here reads or writes your library at any point. If you uninstall it, every other ᝯㄝₓ plugin says so in its own settings group rather than failing quietly.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/GTTxCore/README.md"
version: 1.0.1
ui:
  javascript:
    - GTTxCore.js
settings:
  a1TaggerDuration:
    displayName: Emphasise a Tagger Duration Mismatch
    description: "Emphasise the Scene Tagger's duration mismatch.\n\nStash's tagger prints \"Duration off by at least Ns\" among the other fields on a search result, in the same weight and colour as everything beside it - and it is the one line there that decides whether a match is the right file. With this on, that sentence is drawn larger, capitalised and red when the gap is more than five seconds, and amber when it is more than one; anything closer is left alone.\n\nOff by default, because it restyles a page this plugin does not own. It changes only how the sentence looks: nothing is hidden, reordered, acted on or written."
    type: BOOLEAN
  a2SelectPaste:
    displayName: Right-Click Paste in Tags and Performers Boxes
    description: "Add a right-click Paste to the Tags, Performers and Groups boxes.\n\nThose boxes offer no Paste in the browser's context menu, while Title and Details do - Ctrl+V works from the same box, which is the clue: there is a real text input in there, but it is sized to what has been typed, so with nothing typed it is about two pixels wide and the right-click lands beside it. This widens it to fill the rest of the row, so the pointer is over the input and the browser offers its own Paste.\n\nNothing else changes: the paste goes down the same path Ctrl+V already uses, no clipboard permission is asked for and no menu of ours is drawn. Off by default, because it restyles a page this plugin does not own."
    type: BOOLEAN
  b1DevMods:
    displayName: Dev Mods
    description: "Three switches for working on these plugins, not for using them.\n\nPress Dev Mods... to open them. Debug mode turns on the [<prefix> gate] console channel in every ᝯㄝₓ plugin that draws a control into Stash's own rows, saying for each one whether it is shown or hidden and why. Layout edit mode outlines every control these plugins have injected into Stash's chrome and labels it with the plugin that owns it. Stale UI demo makes the red Reload UI button appear beside Stash's own Reload plugins without waiting for a real version mismatch.\n\nAll three are off by default and none of them changes anything in your library. They are stored here so the console incantation is not the only way in; the console still works, and still uses the same flags."
    type: STRING
