name: ᝯㄝₓ Entity Name Maintainer
description: "Rename a performer, studio, tag or scene, and this plugin offers to update every other place in your library that mentions the old name.\n\nWhen a rename lands in the tab you are working in, it searches every text field of every entity-type, custom fields included, and lists each occurrence with the text around it. Untick what should stay, filter by type or attribute, and press Proceed. Nothing is written before that, and Undo reverses it while the dialog stays open. Each field is re-read just before it is written, so text that changed since the scan is skipped.\n\nThe scan reads the whole library. The limits below warn about a name that matches too often, then refuse it, and Images, usually the largest type, can be left out.\n\nIt stays quiet while another ᝯㄝₓ plugin runs a bulk task. Scene markers are not covered.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/EntityNameMaintainer/README.md"
version: 3.3.1
ui:
  # Loaded before this script, and installed with it. `plugins.tsx` topologically
  # sorts on this and `useScript` sets `async = false`, so ᝯㄝₓ Core has finished
  # running before this file begins - which is what lets the shared blocks be bound
  # at load rather than looked up on every call.
  requires:
    - GTTxCore
  javascript:
    - EntityNameMaintainer.js
settings:
  a1SkipImages:
    displayName: Skip Images in the Scan
    description: "Leave Images out of the scan, so it covers the other six types only.\n\nImages are usually the most numerous type in a library by a wide margin, and reading them can be most of the wait after every rename. Off by default, so the scan covers all seven types. An occurrence in an image title, code, details, photographer, URL or custom field is then neither listed nor replaced, and the dialog says so in its log."
    type: BOOLEAN
  b1WarnAbove:
    displayName: Warn Above This Many Matches
    description: "How many occurrences are enough to be worth a second look before replacing.\n\nLeave it empty for the default of 200. Over this number the dialog puts a Proceed with caution note in its head and in its log, and otherwise behaves exactly as it always does - everything is still listed, still ticked, and still yours to replace. The number exists because a short name matches inside longer words, and a list that long is one nobody reads line by line."
    type: STRING
  c1StopAbove:
    displayName: Refuse Above This Many Matches
    description: "How many occurrences are too many to act on at all.\n\nLeave it empty for the default of 2000. The scan stops the moment it goes past this number, the dialog says why, and Proceed stays disabled - a name that common in your library is very unlikely to be one you meant to replace everywhere. Raise it if you disagree; the listing and Copy log still work, so you can read what it found either way. It is counted in occurrences, not in entities: one long description can hold several."
    type: STRING
