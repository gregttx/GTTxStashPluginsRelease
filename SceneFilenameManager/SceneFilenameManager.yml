name: ᝯㄝₓ Scene Filename Manager
description: "Renaming a file loses its old name for good. This plugin keeps each scene's filenames in a custom field and can put them back.\n\nArchive Original Filenames saves each file's name into the field named below; a name already archived is never overwritten. Restore Original Filenames renames files back to their archived names, keeping extension and folder. Rename Files From Metadata builds new names from the Rename Template below (title, date, performers, tags and more), archiving the old name first.\n\nWhen files move to another scene, or scenes are merged, their archived names are offered to follow.\n\nEvery task lists the files it would touch, writes nothing until you press Proceed, and offers Undo while the dialog stays open.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/SceneFilenameManager/README.md"
version: 2.1.10
ui:
  # Loaded before this script, and installed with it. `plugins.tsx` topologically
  # sorts on this and `useScript` sets `async = false`, so ᝯㄝₓ Core has finished
  # running before this file begins - which is what lets the shared blocks be bound
  # at load rather than looked up on every call.
  requires:
    - GTTxCore
  javascript:
    - SceneFilenameManager.js
settings:
  a1FilenameField:
    displayName: Original Filename Custom Field
    description: "The custom field the original filename is archived in, and restored from.\n\nThe default, ᱜ╦╦🞮_Original_Filename, is written into this box the first time the plugin loads, so what you see here is the name it is actually using; clearing the box goes back to that same default. The value is the name of every file of the scene without its extension, by file id.\n\nChange it only if that name collides with a field you already use. Renaming it here does not move anything already written: Archive will write the new field beside the old one, and Restore reads only the new one."
    type: STRING
  b1RenameTemplate:
    displayName: Rename Template
    description: "The name Rename Files From Metadata gives a file, before its extension, and the four limits it is held to. Rename Template opens an editor that colours the template, lists every token, shows the name it gives for test values and holds the limits.\n\nText in {prefix|token|postfix} is written only where the token has a value, prefix and postfix included, so a separator never dangles beside a missing value; {token} alone has neither. {prefix|!token|postfix} is written only where the token has no value. A prefix or postfix can hold groups of its own, written only when the group around them is: {|basetitle|{ (|year|)}}. Text outside braces is always written, and a token is read in any case.\n\nTokens: title; basetitle and variantpostfix (from ᝯㄝₓ Scene Variants, else the title and nothing); year; date; studio; code; director; performers (nothing at all when Max Performers In Filename is 0); performercount; filename (the name now); origfilename (the archived name, else the name now); ocount; stashid (the stash-id, else the Variant Stash-ID, from ᝯㄝₓ Scene Variants); fileresolution (1920x1080); filereslabel (144p- to Huge+); fileduration (01h02m03s); rating5, or rating10 up to rating100, rounded up; organized and tag=<name or alias> (a tag or any tag under it), which write their prefix and postfix alone, or 1; autoindex2, or autoindex with any start, given only when the name is already taken in the folder, and which renames every file of a scene.\n\nThe default, {[|studio|] }{|basetitle|}{|!basetitle|{|origfilename|}}{ (|year|)}{ |variantpostfix|}{ [|performers|]}{ by |director|}{ |autoindex2|}, gives '[BBC 4 Fun] Cleo Does Vegas with her Friends - Scene #3 (2021) - Promo 2 [Ada, Bea, Cleo, +1] by Keen Key', names a scene with no title after its archived filename, and renames every file of a scene. / and \\ are dropped, the other characters a filename cannot hold become look-alikes (: becomes ∶), spaces are collapsed, and the name is capped at the editor's Maximum Filename Length, cut before an index rather than through it and ending in an ellipsis."
    type: STRING
tasks:
  - name: Archive Original Filenames...
    description: Write the names of each scene's files, without their extensions, into the original-filename custom field, wherever a file's name is not there yet, each by its file id. A name already archived is never overwritten - delete the field on a scene to archive it again. Every scene it would write is listed before anything is written, and Undo puts the field back as it was while the dialog stays open.
  - name: Restore Original Filenames...
    description: Rename every file back to the name archived for it in the original-filename custom field, keeping the file's current extension and folder, wherever the two differ. Every rename is listed before anything is written, and Undo puts the old names back while the dialog stays open.
  - name: Rename Files From Metadata...
    description: Rename the primary file of every scene - every file, when the template has an index - to the name the Rename Template builds from its metadata, keeping the file's extension and folder, wherever the two differ. A filename not archived yet is archived first, so Restore Original Filenames can put it back. Every rename is listed before anything is written, and Undo puts the old names back while the dialog stays open.
