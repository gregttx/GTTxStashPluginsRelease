name: ᝯㄝₓ Scene Filename Manager
description: "A file's name is metadata nothing else in Stash remembers: once a file is renamed, by hand or by another tool, the name it had is gone. This plugin keeps a copy of every scene's filenames in a custom field, and can put them back.\n\nArchive Original Filenames, in Settings → Tasks, writes the names of each scene's files, without their extensions, into the custom field named below, wherever a file's name is not there yet. A name already archived is never overwritten, so the field keeps the first name the plugin saw; delete the field on a scene and the next run archives it again under its current names.\n\nRestore Original Filenames renames every file back to its archived name, keeping the file's current extension and its folder, wherever the two differ. A file whose archived name could not be a filename is listed as skipped rather than renamed, and a name already taken in the folder fails for that file alone.\n\nRename Files From Metadata renames the primary file of every scene - every file, when the template has an index - to the name the Rename Template below builds from its title, date, performers, tags, rating, resolution and more, with the variant set's base title and partial postfix when ᝯㄝₓ Scene Variants is installed. A filename not archived yet is archived first, so Restore can always put it back.\n\nWhen a file is reassigned to another scene, or scenes are merged, the archived names of the files moved are offered to the scene they went to.\n\nEvery task lists every file it would touch before anything is written, write nothing until you press Proceed, and Undo reverses what the dialog wrote while it stays open. With ᝯㄝₓ Custom Fields Bulk Editor installed, the field is given a description there.\n\nRequires Stash 0.31.0 or newer: a scene's custom fields are where the name is kept."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/SceneFilenameManager/README.md"
version: 1.5.1
ui:
  # Loaded before this script, and installed with it. `plugins.tsx` topologically
  # sorts on this and `useScript` sets `async = false`, so ᝯㄝₓ Core has finished
  # running before this file begins - which is what lets the shared blocks be bound
  # at load rather than looked up on every call.
  requires:
    - GTTxCore
  javascript:
    - SceneFilenameManager.js
settings:
  a1FilenameField:
    displayName: Original Filename Custom Field
    description: "The custom field the original filename is archived in, and restored from.\n\nThe default, ᱜ╦╦🞮_Original_Filename, is written into this box the first time the plugin loads, so what you see here is the name it is actually using; clearing the box goes back to that same default. The value is the primary file's name without its extension - or, for a scene with more than one file, every file's name by file id.\n\nChange it only if that name collides with a field you already use. Renaming it here does not move anything already written: Archive will write the new field beside the old one, and Restore reads only the new one."
    type: STRING
  b1RenameTemplate:
    displayName: Rename Template
    description: "The name Rename Files From Metadata gives a file, before its extension. Edit opens an editor that colours the template, lists every token and shows the name it gives for test values.\n\nText in {prefix|token|postfix} is written only where the token has a value, prefix and postfix included, so a separator never dangles beside a missing value; {token} alone has neither. {prefix|!token|postfix} is written only where the token has no value. A prefix or postfix can hold groups of its own, written only when the group around them is: {|basetitle|{ (|year|)}}. Text outside braces is always written, and a token is read in any case.\n\nTokens: title; basetitle and variantpostfix (from ᝯㄝₓ Scene Variants, else the title and nothing); year; date; studio; code; director; performers (nothing at all when Max Performers In Filename is 0); performercount; filename (the name now); origfilename (the archived name, else the name now); ocount; stashid (the stash-id, else the Variant Stash ID, from ᝯㄝₓ Scene Variants); fileresolution (1920x1080); filereslabel (144p- to Huge+); fileduration (01h02m03s); rating5, or rating10 up to rating100, rounded up; organized and tag=<name or alias> (a tag or any tag under it), which write their prefix and postfix alone, or 1; autoindex2, or autoindex with any start, given only when the name is already taken in the folder, and which renames every file of a scene.\n\nThe default, {[|studio|] }{|basetitle|}{|!basetitle|{|origfilename|}}{ (|year|)}{ |variantpostfix|}{ [|performers|]}{ by |director|}{ |autoindex2|}, gives '[BBC 4 Fun] Cleo Does Vegas with her Friends - Scene #3 (2021) - Promo 2 [Ada, Bea, Cleo, +1] by Keen Key', names a scene with no title after its archived filename, and renames every file of a scene. / and \\ are dropped, the other characters a filename cannot hold become look-alikes (: becomes ∶), spaces are collapsed, and the name is capped at the Maximum Filename Length below, cut before an index rather than through it and ending in an ellipsis."
    type: STRING
  b2MaxPerformers:
    displayName: Max Performers In Filename
    description: "How many performers the performers token names: the ones with the most scenes, ties by name. The rest are counted as +N after them. Default 3.\n\n0 names none, so the performers token writes nothing and the group around it is left out. The performercount token gives the number of performers on its own, whatever this is set to."
    type: NUMBER
  b3PerformersAlphabetical:
    displayName: List Performers Alphabetically
    description: "Off: the performers kept are listed by their number of scenes, most first. On: the same performers, alphabetically. Which performers are kept is the same either way."
    type: BOOLEAN
  b4MaxNameBytes:
    displayName: Maximum Filename Length
    description: "The longest name Rename Files From Metadata gives a file, extension included, in bytes: an accented letter takes 2 and an emoji 4. A longer name is cut before its index, never through it. Default 200, from 60 to 255.\n\nMost filesystems allow 255 - ext4, Btrfs, ZFS, NTFS, exFAT, APFS. An encrypted folder allows far less: a Synology encrypted shared folder or any eCryptfs folder takes about 143, so use 140 there."
    type: NUMBER
  b5MaxPathLength:
    displayName: Maximum Full Path Length
    description: "The longest full path Rename Files From Metadata lets a file have - its folder's path, a separator and its name - in characters, the way Windows counts them. Auto (the default), a number from 100, or 0 for no limit. A name that would pass it is cut before its index, with a warning; a folder whose own path leaves no room is skipped with a warning.\n\nAuto picks 259 when Stash or this browser runs on Windows - Stash renames past that, but Explorer and many Windows programs then cannot open or copy the file - else 1023 on macOS and 4095 on Linux, the operating system's own limit. The dialog says which it picked and why.\n\nWhat Auto cannot see: Stash on Linux (or in Docker, which reports Linux even on a Windows host) whose files you open from Windows through a share, while you run these tasks from a browser not on Windows. Auto picks 4095 there - type 259. Nor can it see how long the share's own path is on the Windows side (\\\\nas\\videos\\ against /data/videos/): leave a margin if yours is longer."
    type: STRING
tasks:
  - name: Archive Original Filenames...
    description: Write the names of each scene's files, without their extensions, into the original-filename custom field, wherever a file's name is not there yet - the primary file's name alone, or every file's by id for a scene with more than one. A name already archived is never overwritten - delete the field on a scene to archive it again. Every scene it would write is listed before anything is written, and Undo puts the field back as it was while the dialog stays open.
  - name: Restore Original Filenames...
    description: Rename every file back to the name archived for it in the original-filename custom field, keeping the file's current extension and folder, wherever the two differ. Every rename is listed before anything is written, and Undo puts the old names back while the dialog stays open.
  - name: Rename Files From Metadata...
    description: Rename the primary file of every scene - every file, when the template has an index - to the name the Rename Template builds from its metadata, keeping the file's extension and folder, wherever the two differ. A filename not archived yet is archived first, so Restore Original Filenames can put it back. Every rename is listed before anything is written, and Undo puts the old names back while the dialog stays open.
