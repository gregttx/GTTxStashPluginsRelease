name: ᝯㄝₓ Custom Fields Bulk Editor
description: "View and bulk edit custom fields across a selection or your whole library. Select entities in any Scenes, Images, Galleries, Performers, Studios, Groups or Tags list and pick \"Custom Fields...\" from the \"...\" menu, or run the task to cover everything.\n\nThe dialog lists every custom field in scope, one line per entity and field, with filters on type, field name, entity and value. Click an entity to open it, or a name or value to copy it.\n\nPick one field and Add it where it is missing, Overwrite it, Remove it or Rename it. The write covers exactly the lines the filters leave showing. Nothing is written until you press Apply, and Undo puts the old values back while the dialog stays open.\n\nThe Manage Custom Field Descriptions and Locks... task gives each field a description, shown as a tooltip on its name. Descriptions are stored in a tag, so they are in your database backup and the same in every browser.\n\nAn entity carrying the custom field named below is hidden from Stash's pick-lists while you edit something else.\n\nScene markers have no custom fields and are not offered. Requires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/CustomFieldsBulkEditor/README.md"
version: 4.1.1
ui:
  # Loaded before this script, and installed with it. `plugins.tsx` topologically
  # sorts on this and `useScript` sets `async = false`, so ᝯㄝₓ Core has finished
  # running before this file begins - which is what lets the shared blocks be bound
  # at load rather than looked up on every call.
  requires:
    - GTTxCore
  javascript:
    - CustomFieldsBulkEditor.js
settings:
  a1SkipImagesInTask:
    displayName: Skip Images in the Whole-Library Task
    description: "Leave Images out of the library-wide task, so it covers the other six types only.\n\nImages are usually the most numerous type in a library by a wide margin, and reading them can be most of the wait. Off by default, so the task covers all seven types as it always has. It has no effect on a selection: the \"...\" menu acts on exactly what you selected, and an image list is one of the places you can open it from.\n\nIt applies to the descriptions task as well, where a field only images carry will then read as an orphan."
    type: BOOLEAN
  b1DescriptionTagName:
    displayName: Description Store Tag Name
    description: "The name of the tag that holds every custom field's description.\n\nThe descriptions live in that tag's own description field, as one block of JSON under a sentence saying what it is. The tag is created the first time you press Apply in \"Manage Custom Field Descriptions and Locks...\", and is marked with the custom field ᱜ╦╦🞮_🛂🧲_🛠🛈🖫_desc_store so that it can always be found again - so renaming it here renames the existing tag rather than starting a second store. It is left out of the bulk editor's own listings, since what it carries is this plugin's plumbing rather than your data. Once a store exists, a link to the tag it is on appears beside the value - to the tag itself, found by that mark, rather than to whatever currently answers to this name.\n\nThe default name is written into this box the first time the plugin loads, so what you see here is what it is using. Leave it empty to go back to that default. A name another tag already has cannot be taken: the write fails and says so."
    type: STRING
  c1ExcludeFromAddListField:
    displayName: Hide from Add Lists - Custom Field Name
    description: "Entities carrying this custom field are hidden from Stash's add/select dropdowns.\n\nIt covers Tags, Performers, Studios, Groups, Galleries and Scenes - the six things Stash lets you pick from a dropdown while editing something else. A marked entity is still on its own list page, still on the entities that already have it, and still in the API: this hides it from being added, nothing more. Any value other than empty, 0 or false counts as marked; the plugin writes 1 when it marks its own store tag.\n\nThe list is read once per page load, so marking something in another tab shows up here after a reload. The default name is written into this box the first time the plugin loads; clearing it switches the filtering off entirely, which is why an empty box and an unset one are not the same thing. Renaming the field with the bulk editor's Rename mode moves this setting with it, so the two never drift apart."
    type: STRING
  d1LockedFields:
    displayName: Locked Custom Fields
    description: "Custom fields whose name, description and values no bulk edit may change, and which no bulk edit may remove from an entity - only add where it is missing.\n\nOn Stash's own edit forms a locked field's value box is read-only and its remove button gone, and a save that would still change or remove its value is refused before it reaches Stash.\n\nShown here, changed in Manage Custom Field Descriptions and Locks...: pick the field and press the lock in front of its name. In this plugin, Overwrite and Remove are refused on a locked field, with the reason on Apply, and so is a Rename away from one; Add stays open, since it never overwrites. The descriptions dialog shows a locked field's description read-only, refuses to rename it, and Prune keeps it; a sibling's description update skips it. ᝯㄝₓ Find & Replace Entities by Text Content's Replace leaves a locked field's name and value alone, and never renames a field onto a locked name.\n\nᝯㄝₓ Entity Name Maintainer, ᝯㄝₓ Scene Variants and ᝯㄝₓ Scene Filename Manager honor it too, and no Undo in any of them removes a locked field. Stash's own edit form is not stopped by it. Empty by default: nothing is locked."
    type: STRING
tasks:
  - name: Edit Custom Fields Across the Whole Library...
    description: Open the same dialog on every Scene, Image, Gallery, Performer, Studio, Group and Tag in the library, rather than on a selection. It lists what they carry, and one Apply writes one custom field across all of them - or across only the lines the filters leave showing. Nothing is written until you press Apply, and Undo takes it back while the dialog stays open. Reading a large library takes a moment; the dialog counts up as it goes.
  - name: Manage Custom Field Descriptions and Locks...
    description: Write down what each custom field means. It scans the library, lists every custom field found on the left with how many entities carry it, and gives each one a description box, a lock that writes the field into or out of the Locked Custom Fields setting at once, and a read-only list of what carries it. Descriptions are kept in the description of one tag, so they are in the database rather than in your browser. Nothing is written until you press Apply, and Undo puts the tag back while the dialog stays open.
