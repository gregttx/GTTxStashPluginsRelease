name: ᝯㄝₓ De-Spicer
description: "Vanillify and anonymize your library: rewrite what names real people, studios and sites, and what is explicit, across every entity-type at once.\n\nRun it from Settings - Tasks - Plugin Tasks. Choose the goals - Anonymize, Vanillify or both - and how each kind of data is treated: kept, blanked, replaced by a placeholder or by a consistent pseudonym. The scan lists every change, entity by entity, before and after; nothing is written until you press Proceed.\n\nBACKING UP YOUR DATABASE BEFORE THE FIRST RUN IS STRONGLY RECOMMENDED.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/GTTx-DeSpicer/README.md"
version: 1.0.0
ui:
  # Loaded before this script, and installed with it. `plugins.tsx` topologically
  # sorts on this and `useScript` sets `async = false`, so ᝯㄝₓ Core has finished
  # running before this file begins - which is what lets the shared blocks be bound
  # at load rather than looked up on every call.
  requires:
    - GTTxCore
  javascript:
    - default-terms.gen.js
    - DeSpicer.js
  # Served at /plugin/DeSpicer/assets/: the canned animation an animated image becomes under a
  # card, fetched only when one is written (`IMAGES.canned`). Made by .tools/canned-apng.py.
  assets:
    /: assets
tasks:
  - name: De-Spice Library...
    description: Scan every Scene, Image, Gallery, Performer, Studio, Group, Tag, Scene Marker and saved filter and list what the goals and rules would change, entity by entity, before and after. Untick what should stay. Nothing is written until you press Proceed; Undo takes it back while the dialog stays open.
