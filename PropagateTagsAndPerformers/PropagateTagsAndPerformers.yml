name: ᝯㄝₓ Propagate Tags and Performers to Related Entities
description: "Copies tags and performers from related entities onto the entity that links them.\n\nThirteen paths, each off until you enable it in the Path Settings dialog. Tags onto Scenes from their performers, studio, markers or groups; onto Galleries from their images; onto Images from their galleries; onto Groups from their scenes, studio, sub-groups, and from those scenes' performers and markers. Performers onto Scenes from their galleries, and onto Galleries from their images.\n\nCopy, never move - nothing is ever removed from the source.\n\nThree ways to run it: buttons on the target's Edit tab or the source's own detail page, automatically whenever Stash saves an entity, or as one library-wide task in Settings - Tasks - Plugin Tasks. The buttons and the auto-modes are off until you enable them below.\n\nNothing is written behind your back: a button either stages its additions in the edit form for you to save, or opens a dialog listing every change first - and so does the task. Nothing lands until you press Proceed, and Undo takes the run back while the dialog stays open.\n\nBACKING UP YOUR DATABASE BEFORE THE FIRST RUN IS STRONGLY RECOMMENDED.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/GTTxStashPluginsRelease/blob/main/PropagateTagsAndPerformers/README.md"
version: 6.4.1
ui:
  # Loaded before this script, and installed with it. `plugins.tsx` topologically
  # sorts on this and `useScript` sets `async = false`, so ᝯㄝₓ Core has finished
  # running before this file begins - which is what lets the shared blocks be bound
  # at load rather than looked up on every call.
  requires:
    - GTTxCore
  javascript:
    - PropagateTagsAndPerformers.js
tasks:
  - name: Propagate All...
    description: Run every path enabled below across the whole library, in a fixed order. Opens a dialog that lists every change first; nothing is written until you press Proceed. It only ever adds tags and performers. An Undo button takes back what it added while the dialog stays open, and ᝯㄝₓ Core's Undo History keeps the run in this browser after that - neither is a backup, so BACKING UP YOUR DATABASE BEFORE THE FIRST RUN IS STRONGLY RECOMMENDED. The seven in Exclusion Filters, below, all apply, and so does the eighth, inside the Path Settings dialog. Path Settings opens from that dialog's own footer, and from the button on the Paths row below.
settings:
  a1ManualButtons:
    displayName: Manual Buttons
    description: "Which of the plugin's manual buttons are shown, as one line.\n\nThere are twenty-four: one on the Edit tab of a scene, gallery, image or group for each of the thirteen paths into it, pulling its tags or performers in, and one on the detail page of the source itself - a performer, a studio, or one of the four entities acting as a source for another - for each of the eleven paths that have one, pushing its tags or performers out to everything the path reaches. Marker paths have no source button: a marker has no detail page of its own to put one on. Every button is off until you switch it on; one whose path is off in Path Settings does not appear until the path is on, and one that would add nothing to the entity in front of you hides itself. The source-side buttons have no staging option - one click can reach many different entities at once, and there is no single form to stage that into - so they open a review dialog listing every change instead, and write nothing until you press Proceed.\n\nPress Manual Buttons Settings to change it: one switch per button, Show All and Show None, and the Save Immediately switch - which makes the Edit-tab buttons review in a dialog instead of staging in the form, and lives in that dialog rather than here. It is stored as one line of text, target:<path> or source:<path> for each button that is on, and anything that writes it directly is read forgivingly - any order, any case, any separators between the entries. A button nobody mentions is off. If Show Manual Buttons was on in an earlier release, every button starts on."
    type: STRING
  a3AutoPropagation:
    displayName: Auto-Propagation and Depropagate Assist
    description: "Which of the two auto-modes are on, and how they write, as one line.\n\nBoth react to Stash's own saves immediately - they only ever add, but they add the moment Stash saves. When the target is saved: whenever Stash saves a scene, gallery, image or group, every enabled path that copies into it runs on that one entity - one small read per save, the cheaper of the two. When the source is saved: whenever Stash saves an entity, its tags or performers are pushed into every entity an enabled path copies them to - this one fans out, and saving a popular performer can rewrite every scene they appear in. The seven in Exclusion Filters, below, apply to both. Unless Silent Auto-propagation is on, a reaction first opens a dialog listing every addition, ticked, and writes only what you leave ticked when you press OK; with Silent on it writes with no dialog. Either way every write is recorded in ᝯㄝₓ Core's Undo History. Depropagate assist is the reverse offer: when a save takes away something tags came from along an active path - a scene's performer, studio or group, an image's gallery, a group's studio or sub-group, or a scene, image, group or marker leaving what it belonged to - a dialog lists the tags it brought that nothing still related carries, unticked, and removes only what you tick.\n\nPress Auto-Propagation and Depropagate Assist to change it: one switch per mode and per option, and nothing is stored until you press Save. It is stored as one line of text - target, source, silent, depropagate - and anything that writes it directly is read forgivingly. A word nobody mentions is off. If either of the two switches this replaced was on in an earlier release, that mode starts on, not silent."
    type: STRING
  b1Paths:
    displayName: Paths
    description: "Which of the thirteen paths run, and how, as one line.\n\nA path is Off, On, or - for the two that offer it - on for only the tags every source shares. Off is what a path does until you say otherwise; a path that is on is covered by the task, shows its manual buttons, and is written along by whichever auto-modes are enabled above.\n\nPress Path Settings to change it: the thirteen buttons are the editor for this setting, and each one takes its next state on a click. Three buttons above them set every path at once. It is stored as one line of text, and anything that writes it directly is read forgivingly - any order, any case, and any separators between the pairs - with whatever was understood written back in canonical form. A path nobody mentions is off.\n\nThat dialog also holds the eighth exclusion filter - the one that skips tags ᝯㄝₓ Normalize Parent Tags would prune straight back off. It is there rather than here because it is the one filter whose rule belongs to another plugin, and the dialog can say whether that plugin is answering. The seven in Exclusion Filters, below, apply to every path as well."
    type: STRING
